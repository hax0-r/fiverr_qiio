<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qiio</title>
    <meta name="description" content="">
    <script src="./Docs/Libraries/javascripts/browser@4.js"></script>
    <link rel="stylesheet" href="./Docs/Style.css">
    <script defer src="./Docs/Libraries/javascripts/cdn.min.js"></script>
</head>

<body>

    <div id="navbar"></div>

    <img src="./Docs/Assets/Banner_contact.jpg" class="w-full md:max-h-[calc(100vh-6rem)] object-cover" alt="">

    <section class="max-w-5xl w-full mx-auto p-5 md:mt-16 mt-10">
        <h2 class="text-[#4285f4] md:text-3xl text-xl  font-medium mx-auto max-w-4xl text-center custom-heading">Contact <span class="dots"></span>
        </h2>

        <div class="flex items-center justify-center md:gap-20 gap-7 md:flex-row flex-col md:mt-10 mt-8 ">

            <div class="md:max-w-[50%] w-full">
                <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d43391.12606174658!2d8.430936!3d47.178506!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47900100a2548ea7%3A0x785c9bafc4d2aa1!2sChamerstrasse%2042A%2C%206331%20H%C3%BCnenberg%2C%20Switzerland!5e0!3m2!1sen!2sus!4v1744974277151!5m2!1sen!2sus" class="w-full md:h-76 rounded-lg h-44" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <div class="md:max-w-[50%] w-full">
                <ul class=" text-xl space-y-2 text-gray-700">
                   <li class="font-medium"> qiio Switzerland AG</li>
                   <li> Chamerstrasse 42a</li>
                   <li> 6331 Hünenberg</li>
                   <li> Switzerland</li>
                   <li> info@qiio.com</li>
                </ul>
            </div>

        </div>
        <form action="" class="w-full mx-auto max-w-5xl md:mt-16 mt-10">
            <label for="" class="text-gray-800 text-lg">Name <span class="text-red-600">*</span></label>
            <input required type="text" class="w-full mb-5 border p-3 mt-1 border-gray-600" name="" id="">
            <label for="" class="text-gray-800 text-lg">First Name <span class="text-red-600">*</span></label>
            <input required type="text" class="w-full border mb-5 p-3 mt-1 border-gray-600" name="" id="">
            <label for="" class="text-gray-800 text-lg">Company Name <span class="text-red-600">*</span></label>
            <input required type="text" class="w-full border mb-5 p-3 mt-1 border-gray-600" name="" id="">
            <label for="" class="text-gray-800 text-lg">E-Mail <span class="text-red-600">*</span></label>
            <input required type="email" class="w-full border mb-5 p-3 mt-1 border-gray-600" name="" id="">
            <label for="" class="text-gray-800 text-lg">Phone <span class="text-red-600">*</span></label>
            <input required type="number" class="w-full border mb-5 p-3 mt-1 border-gray-600" name="" id="">
            <label for="" class="text-gray-800 text-lg">Request <span class="text-red-600">*</span></label>
            <textarea required type="text" class="w-full border mb-3  p-3 mt-1 border-gray-600 resize-none" name=""
                rows="6"></textarea>
            <button
                class="w-full block px-5 capitalize text-center cursor-pointer hover:opacity-80 transition-all duration-500 rounded-lg py-3.5 bg-[#4285f4] text-white font-medium">Send</button>
        </form>

    </section>


    <div class="md:mt-16 mt-8 " id="footer"></div>

    <script src="./Docs/javascript/Navbar.js"></script>
    <script src="./Docs/javascript/global.js"></script>
    <script src="./Docs/javascript/Footer.js"></script>

</body>

</html>
